user root;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    types {
        application/x-mpegURL m3u8;
        application/vnd.apple.mpegurl m3u8;
        audio/aac aac;
        audio/mp4 m4s mp4;
        audio/mpeg mp3;
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 120s;
    keepalive_requests 10000;
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 1;
    open_file_cache_errors off;

    server {
        listen 8080 default_server;
        server_name _;

        location /stream.mp3 {
            proxy_pass http://127.0.0.1:8081/stream.mp3;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Icy-MetaData $http_icy_metadata;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /live.mp3 {
            proxy_pass http://127.0.0.1:8081/stream.mp3;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Icy-MetaData $http_icy_metadata;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /hls {
            root /var/www;
            mirror /internal-track;
            
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers '*' always;
            
            location ~* \.m3u8$ {
                root /var/www;
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Access-Control-Allow-Origin * always;
                add_header Content-Type "application/x-mpegURL" always;
            }
            
            location ~* \.(m4s|mp4|aac)$ {
                root /var/www;
                add_header Cache-Control "public, max-age=300, immutable" always;
                add_header Access-Control-Allow-Origin * always;
                add_header Content-Type "audio/mp4" always;
            }
        }

        location = /internal-track {
            internal;
            proxy_pass http://127.0.0.1:8081/internal/log;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header User-Agent $http_user_agent;
        }

        location /stats {
            proxy_pass http://127.0.0.1:8081/stats;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /listeners {
            proxy_pass http://127.0.0.1:8081/listeners;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
