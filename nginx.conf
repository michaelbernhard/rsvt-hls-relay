server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name stream.reservatet.fm _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Health check endpoint
    location /health {
        default_type text/plain;
        return 200 "OK\n";
    }

    # Direct MP3 streams over HTTP (avoids TLS overhead and redirects on Sonos & hardware players)
    location ~ ^/(live\.mp3|stream\.mp3|sonos\.mp3|bloede\.mp3)$ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers * always;
            return 204;
        }
        if ($request_method = 'HEAD') {
            add_header Access-Control-Allow-Origin * always;
            add_header Content-Type audio/mpeg;
            return 200;
        }

        mirror /internal/mirror_track;
        mirror_request_body off;

        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_ignore_client_abort off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers * always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Asynchronous Mirror Subrequest for Listener Telemetry (100% Out-Of-Band)
    location = /internal/mirror_track {
        internal;
        proxy_pass http://127.0.0.1:8082/internal/connect;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-User-Agent $http_user_agent;
        proxy_set_header X-Stream-URI $request_uri;
        proxy_connect_timeout 500ms;
        proxy_read_timeout 500ms;
        proxy_send_timeout 500ms;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name stream.reservatet.fm;

    ssl_certificate /etc/letsencrypt/live/stream.reservatet.fm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stream.reservatet.fm/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Health check endpoint
    location /health {
        default_type text/plain;
        return 200 "OK\n";
    }

    # Direct MP3 streams directly to Icecast (C-level native streaming, zero JS overhead)
    location ~ ^/(live\.mp3|stream\.mp3|sonos\.mp3|bloede\.mp3)$ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers * always;
            return 204;
        }
        if ($request_method = 'HEAD') {
            add_header Access-Control-Allow-Origin * always;
            add_header Content-Type audio/mpeg;
            return 200;
        }

        mirror /internal/mirror_track;
        mirror_request_body off;

        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_ignore_client_abort off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers * always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Root fallback directly to Icecast live.mp3
    location = / {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers * always;
            return 204;
        }
        if ($request_method = 'HEAD') {
            add_header Access-Control-Allow-Origin * always;
            add_header Content-Type audio/mpeg;
            return 200;
        }

        mirror /internal/mirror_track;
        mirror_request_body off;

        proxy_pass http://127.0.0.1:8000/live.mp3;
        proxy_buffering off;
        proxy_ignore_client_abort off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers * always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Asynchronous Mirror Subrequest for Listener Telemetry (100% Out-Of-Band)
    location = /internal/mirror_track {
        internal;
        proxy_pass http://127.0.0.1:8082/internal/connect;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-User-Agent $http_user_agent;
        proxy_set_header X-Stream-URI $request_uri;
        proxy_connect_timeout 500ms;
        proxy_read_timeout 500ms;
        proxy_send_timeout 500ms;
    }

    # HLS Live Streaming (served directly from RAM disk)
    location /hls/ {
        alias /dev/shm/hls/;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers * always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        location ~ \.m3u8$ {
            types { application/vnd.apple.mpegurl m3u8; }
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Access-Control-Allow-Origin * always;
        }

        location ~ \.ts$ {
            types { video/mp2t ts; }
            add_header Cache-Control "public, max-age=60" always;
            add_header Access-Control-Allow-Origin * always;
        }
    }
}
