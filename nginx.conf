worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /dev/shm;

        # Health check endpoint
        location /health {
            default_type text/plain;
            return 200 "OK\n";
        }

        # Direct High-Performance MP3 Streaming for Sonos and Web
        location /live.mp3 {
            proxy_pass http://127.0.0.1:8082/live.mp3;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Access-Control-Allow-Origin * always;
            add_header Content-Type 'audio/mpeg' always;
            add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        }

        location /bloede.mp3 {
            proxy_pass http://127.0.0.1:8082/bloede.mp3;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Access-Control-Allow-Origin * always;
            add_header Content-Type 'audio/mpeg' always;
            add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        }

        # Fallback root to live MP3
        location = / {
            proxy_pass http://127.0.0.1:8082/live.mp3;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            add_header Access-Control-Allow-Origin * always;
            add_header Content-Type 'audio/mpeg' always;
        }

        # HLS Live Streaming
        location /hls/ {
            alias /dev/shm/hls/;

            # CORS headers for web, app and Sonos
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers * always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            # Cache settings
            location ~ \.m3u8$ {
                types {
                    application/vnd.apple.mpegurl m3u8;
                }
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Access-Control-Allow-Origin * always;
            }

            location ~ \.ts$ {
                types {
                    video/mp2t ts;
                }
                add_header Cache-Control "public, max-age=60" always;
                add_header Access-Control-Allow-Origin * always;
            }
        }
    }
}
